<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>PriceHunt — Find Best Prices in UAE</title>
<style>
:root {
  --purple: #7C3AED;
  --purple-dark: #4C1D95;
  --white: #FFFFFF;
  --gray-50: #F9FAFB;
  --gray-100: #F3F4F6;
  --gray-200: #E5E7EB;
  --gray-400: #9CA3AF;
  --gray-500: #6B7280;
  --gray-700: #374151;
  --gray-900: #111827;
  --green: #10B981;
  --red: #EF4444;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  background: var(--white);
  color: var(--gray-900);
  line-height: 1.5;
}

/* ──────── HEADER ──────── */
header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(255, 255, 255, 0.98);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--gray-200);
  padding: 12px 20px;
}
.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.logo {
  font-size: 20px;
  font-weight: 800;
  background: linear-gradient(135deg, var(--purple), #EC4899);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  text-decoration: none;
}
.logo:hover { opacity: 0.8; }

/* ──────── HERO ──────── */
.hero {
  background: linear-gradient(135deg, var(--purple-dark) 0%, var(--purple) 50%, #6D28D9 100%);
  color: white;
  padding: 60px 20px;
  text-align: center;
}
.hero-inner {
  max-width: 900px;
  margin: 0 auto;
}
.hero h1 {
  font-size: clamp(28px, 6vw, 48px);
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}
.hero .highlight { color: #FCD34D; }
.hero p {
  font-size: 16px;
  opacity: 0.9;
  margin-bottom: 24px;
}
.search-box {
  display: flex;
  gap: 8px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 8px;
  padding: 8px;
  max-width: 600px;
  margin: 0 auto 24px;
  box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
}
.search-box input {
  flex: 1;
  border: none;
  background: transparent;
  padding: 12px 16px;
  font-size: 16px;
  outline: none;
  color: var(--gray-900);
}
.search-box input::placeholder {
  color: var(--gray-400);
}
.search-btn {
  background: linear-gradient(135deg, var(--purple), #EC4899);
  border: none;
  color: white;
  padding: 12px 28px;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s;
}
.search-btn:hover { opacity: 0.9; }
.search-btn:active { transform: scale(0.98); }
.trust-badges {
  display: flex;
  gap: 20px;
  justify-content: center;
  font-size: 14px;
  opacity: 0.85;
  flex-wrap: wrap;
}

/* ──────── MAIN ──────── */
main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 40px 20px;
}

/* ──────── CATEGORIES ──────── */
.section-title {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.categories {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
  gap: 12px;
  margin-bottom: 48px;
}
.cat-btn {
  background: var(--gray-50);
  border: 2px solid transparent;
  padding: 16px;
  border-radius: 8px;
  text-align: center;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  transition: all 0.2s;
}
.cat-btn:hover {
  border-color: var(--purple);
  background: rgba(124, 58, 237, 0.05);
}
.cat-icon {
  font-size: 32px;
  margin-bottom: 8px;
}

/* ──────── TRENDING ──────── */
.trending {
  margin-bottom: 48px;
}
.trending-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 16px;
}
.trending-card {
  background: var(--gray-50);
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.2s;
}
.trending-card:hover {
  border-color: var(--purple);
  box-shadow: 0 4px 12px rgba(124, 58, 237, 0.15);
  transform: translateY(-2px);
}
.trending-save {
  display: inline-block;
  background: var(--green);
  color: white;
  font-size: 12px;
  font-weight: 600;
  padding: 4px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
}
.trending-name {
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--gray-900);
}
.trending-price {
  font-size: 18px;
  font-weight: 700;
  color: var(--purple);
}
.trending-stores {
  font-size: 12px;
  color: var(--gray-500);
  margin-top: 4px;
}

/* ──────── RESULTS ──────── */
#results { display: none; }
#results.show { display: block; }

.results-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 12px;
}
.best-price-box {
  background: linear-gradient(135deg, var(--purple-dark), var(--purple));
  color: white;
  padding: 24px;
  border-radius: 12px;
  flex: 1;
  min-width: 250px;
}
.best-price-label {
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  opacity: 0.8;
  margin-bottom: 8px;
}
.best-price-amount {
  font-size: 36px;
  font-weight: 800;
  margin-bottom: 4px;
}
.best-price-source {
  font-size: 14px;
  opacity: 0.9;
}

.result-count {
  font-size: 14px;
  color: var(--gray-500);
}

/* ──────── SOURCE STATS ──────── */
.source-stats {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 24px;
}
.stat-pill {
  background: var(--gray-100);
  border: 1px solid var(--gray-200);
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
}
.stat-pill.has { border-color: var(--green); background: rgba(16, 185, 129, 0.05); color: var(--green); }
.stat-pill.no { border-color: var(--red); background: rgba(239, 68, 68, 0.05); color: var(--red); }

/* ──────── FILTER & SORT ──────── */
.controls {
  display: flex;
  gap: 12px;
  margin-bottom: 24px;
  flex-wrap: wrap;
}
.filter-btn {
  background: var(--white);
  border: 1px solid var(--gray-300);
  padding: 8px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: all 0.2s;
}
.filter-btn:hover { border-color: var(--purple); }
.filter-btn.active {
  background: var(--purple);
  color: white;
  border-color: var(--purple);
}
.sort-sel {
  border: 1px solid var(--gray-300);
  padding: 8px 12px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
}

/* ──────── RESULTS GRID ──────── */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 40px;
}

.card {
  background: var(--white);
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  flex-direction: column;
}
.card:hover {
  border-color: var(--purple);
  box-shadow: 0 8px 24px rgba(124, 58, 237, 0.12);
  transform: translateY(-4px);
}
.card.best {
  border: 2px solid var(--purple);
}
.card.best .best-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: var(--purple);
  color: white;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
}

.card-img {
  width: 100%;
  height: 160px;
  background: var(--gray-100);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
}
.card-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.card-img .no-img {
  font-size: 48px;
}

.card-body {
  padding: 12px;
  flex: 1;
  display: flex;
  flex-direction: column;
}
.src-badge {
  display: inline-block;
  background: var(--gray-100);
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
  margin-bottom: 8px;
  width: fit-content;
}
.card-title {
  font-weight: 600;
  font-size: 14px;
  margin-bottom: 8px;
  line-height: 1.3;
  flex-grow: 1;
}
.card-price {
  font-size: 18px;
  font-weight: 700;
  color: var(--purple);
  margin-bottom: 8px;
}
.card-meta {
  font-size: 12px;
  color: var(--gray-500);
}
.mline { display: flex; gap: 4px; margin-bottom: 4px; }

/* ──────── EMPTY STATE ──────── */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--gray-500);
}
.empty-state .icon {
  font-size: 64px;
  margin-bottom: 16px;
}
.empty-state h3 {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 8px;
  color: var(--gray-900);
}

/* ──────── AUTOCOMPLETE ──────── */
.ac-wrap { position: relative; flex: 1; }
.ac-wrap input { width: 100%; }
.suggestions {
  position: absolute;
  top: calc(100% + 4px);
  left: 0; right: 0;
  background: white;
  border: 1px solid var(--gray-200);
  border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  z-index: 999;
  overflow: hidden;
}
.sug-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 16px;
  font-size: 14px;
  color: var(--gray-900);
  cursor: pointer;
  transition: background 0.1s;
}
.sug-item:hover, .sug-item.active {
  background: rgba(124, 58, 237, 0.07);
}
.sug-icon { font-size: 14px; color: var(--gray-400); }

/* ──────── LOADING ──────── */
.spin {
  width: 14px;
  height: 14px;
  border: 2px solid rgba(255, 255, 255, 0.3);
  border-top-color: white;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: inline-block;
  margin-right: 6px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.skel {
  background: var(--gray-100);
  border-radius: 8px;
  padding: 12px;
  animation: pulse 1.5s ease-in-out infinite;
}
.skel-img { height: 160px; background: var(--gray-200); border-radius: 4px; margin-bottom: 12px; }
.skel-body { display: flex; flex-direction: column; gap: 8px; }
.skel-line { height: 12px; background: var(--gray-200); border-radius: 2px; }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

/* ──────── RESPONSIVE ──────── */
@media (max-width: 768px) {
  main { padding: 24px 16px; }
  .search-box { flex-direction: column; }
  .search-box input { padding: 12px; }
  .search-btn { width: 100%; }
  #grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
}
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="logo" href="/">⚡ PriceHunt</a>
    <div style="font-size:12px;color:var(--gray-500)">UAE's Best Prices</div>
  </div>
</header>

<div class="hero">
  <div class="hero-inner">
    <h1>Find the Best Price in <span class="highlight">UAE & MENA</span></h1>
    <p>Search 12 sources simultaneously — online stores, physical stores, classifieds & AliExpress</p>
    <div class="search-box">
      <div class="ac-wrap">
        <input type="text" id="q" placeholder="Search any product..." autocomplete="off" />
        <div class="suggestions" id="suggestions" style="display:none"></div>
      </div>
      <button class="search-btn" id="huntBtn">Hunt Prices</button>
    </div>
    <div class="trust-badges">
      <span>✨ Real-time prices from 12 sources</span>
      <span>💰 All prices in AED</span>
    </div>
  </div>
</div>

<main id="home">
  <div class="section-title">📁 Browse by Category</div>
  <div class="categories" id="categories"></div>

  <div class="section-title">🔥 Trending Searches</div>
  <div class="trending-grid" id="trending"></div>
</main>

<main id="results">
  <div class="results-header">
    <div class="best-price-box" id="bestBox" style="display:none">
      <div class="best-price-label">Best Price Found</div>
      <div class="best-price-amount" id="bestAmt">—</div>
      <div class="best-price-source" id="bestSrc">—</div>
    </div>
    <div class="result-count" id="resultCnt"></div>
  </div>

  <div class="source-stats" id="statsPills"></div>

  <div class="controls">
    <div id="filterBtns"></div>
    <select class="sort-sel" id="sortSel">
      <option value="relevance">Best Match</option>
      <option value="price_asc">Price: Low → High</option>
      <option value="price_desc">Price: High → Low</option>
      <option value="source">By Store</option>
    </select>
  </div>

  <div id="grid"></div>
</main>

<script>
var allResults = [];
var activeFilter = 'all';
var activeSort = 'relevance';
var searchQuery = '';

/* Categories */
var CATEGORIES = [
  { icon: '📱', name: 'Electronics', q: 'iPhone' },
  { icon: '👗', name: 'Fashion', q: 'shirt' },
  { icon: '🏠', name: 'Home', q: 'sofa' },
  { icon: '⚽', name: 'Sports', q: 'football' },
  { icon: '💄', name: 'Beauty', q: 'perfume' },
  { icon: '📚', name: 'Books', q: 'novel' },
  { icon: '🎮', name: 'Gaming', q: 'PS5' },
  { icon: '🚗', name: 'Auto', q: 'car parts' },
];

var TRENDING = [
  { name: 'iPhone 15 Pro', price: '4,299', stores: 10, save: '15%' },
  { name: 'Samsung TV 55"', price: '1,899', stores: 8, save: '22%' },
  { name: 'MacBook Air M2', price: '3,299', stores: 6, save: '10%' },
  { name: 'AirPods Pro', price: '799', stores: 9, save: '18%' },
];

function initHome() {
  var html = '';
  CATEGORIES.forEach(function(c) {
    html += '<button class="cat-btn" onclick="doSearch(\'' + c.q + '\')">'
      + '<div class="cat-icon">' + c.icon + '</div>'
      + '<div>' + c.name + '</div>'
      + '</button>';
  });
  document.getElementById('categories').innerHTML = html;

  html = '';
  TRENDING.forEach(function(t) {
    html += '<div class="trending-card" onclick="doSearch(\'' + t.name + '\')">'
      + '<div class="trending-save">Save ' + t.save + '</div>'
      + '<div class="trending-name">' + t.name + '</div>'
      + '<div class="trending-price">AED ' + t.price + '</div>'
      + '<div class="trending-stores">' + t.stores + ' stores</div>'
      + '</div>';
  });
  document.getElementById('trending').innerHTML = html;
}

function doSearch(q) {
  q = q || document.getElementById('q').value.trim();
  if (!q) return;
  searchQuery = q;
  document.getElementById('q').value = q;

  document.getElementById('home').style.display = 'none';
  document.getElementById('results').classList.add('show');

  setLoading(true);
  activeFilter = 'all';

  fetch('/api/search?query=' + encodeURIComponent(q))
    .then(r => r.json())
    .then(data => {
      allResults = data.results || [];
      renderBest(data.best_price);
      renderStats(data.source_stats || {});
      renderFilters();
      renderSort();
      renderGrid();
    })
    .catch(err => {
      document.getElementById('grid').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Error</h3><p>' + err + '</p></div>';
    })
    .finally(() => setLoading(false));
}

function renderBest(best) {
  var box = document.getElementById('bestBox');
  if (!best) { box.style.display = 'none'; return; }
  document.getElementById('bestAmt').textContent = best.price_text;
  document.getElementById('bestSrc').textContent = 'at ' + best.source;
  box.style.display = 'block';
}

function renderStats(stats) {
  var html = '';
  var labels = {
    amazon:'Amazon.ae', noon:'Noon', carrefour:'Carrefour', sharafdg:'Sharaf DG',
    lulu:'Lulu', virgin:'Virgin', jumbo:'Jumbo', namshi:'Namshi',
    desertcart:'Desertcart', dubizzle:'Dubizzle', opensooq:'OpenSooq', aliexpress:'AliExpress', ebay:'eBay', google:'Google Shopping', emax:'Emax'
  };
  for (var src in stats) {
    var n = stats[src];
    var lbl = labels[src] || src;
    var cls = n > 0 ? 'has' : 'no';
    html += '<span class="stat-pill ' + cls + '">' + lbl + ' ' + (n > 0 ? n : '✗') + '</span>';
  }
  document.getElementById('statsPills').innerHTML = html;
  document.getElementById('resultCnt').textContent = allResults.length + ' total result' + (allResults.length !== 1 ? 's' : '');
}

function renderFilters() {
  var sources = new Set(allResults.map(r => (r.source || '').toLowerCase()));
  var html = '<button class="filter-btn active" onclick="setFilter(\'all\')">All Sources</button>';
  sources.forEach(function(s) {
    if (s) html += '<button class="filter-btn" onclick="setFilter(\'' + s + '\')">' + s + '</button>';
  });
  document.getElementById('filterBtns').innerHTML = html;
}

function setFilter(src) {
  activeFilter = src;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderGrid();
}

function renderSort() {
  document.getElementById('sortSel').value = activeSort;
}

document.getElementById('sortSel').addEventListener('change', function() {
  activeSort = this.value;
  renderGrid();
});

function renderGrid() {
  var items = allResults.filter(function(r) {
    if (activeFilter === 'all') return true;
    return (r.source || '').toLowerCase().includes(activeFilter);
  });

  var INF = 999999999;
  items = items.slice().sort(function(a, b) {
    if (activeSort === 'relevance') {
      var ra = a._relevance != null ? a._relevance : 0;
      var rb = b._relevance != null ? b._relevance : 0;
      if (rb !== ra) return rb - ra;
      return (a.price != null ? a.price : INF) - (b.price != null ? b.price : INF);
    }
    if (activeSort === 'price_asc') {
      return (a.price != null ? a.price : INF) - (b.price != null ? b.price : INF);
    }
    if (activeSort === 'price_desc') {
      return (b.price != null ? b.price : -INF) - (a.price != null ? a.price : -INF);
    }
    return (a.source || '').localeCompare(b.source || '');
  });

  var lowestPrice = null;
  for (var i = 0; i < items.length; i++) {
    if (items[i].price != null && (lowestPrice === null || items[i].price < lowestPrice)) {
      lowestPrice = items[i].price;
    }
  }

  var grid = document.getElementById('grid');
  if (items.length === 0) {
    grid.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>No results</h3><p>Try a different search term.</p></div>';
    return;
  }

  var html = '';
  for (var i = 0; i < items.length; i++) {
    html += buildCard(items[i], lowestPrice);
  }
  grid.innerHTML = html;
}

function buildCard(r, lowestPrice) {
  var isBest = r.price != null && r.price === lowestPrice;
  var img = r.image && r.image.indexOf('http') === 0
    ? '<img src="' + esc(r.image) + '" alt="' + esc(r.title) + '" onerror="this.style.display=\'none\'">'
    : '<span class="no-img">📦</span>';
  var priceHtml = r.price != null
    ? '<div class="card-price">' + esc(r.price_text) + '</div>'
    : '<div class="card-price" style="color:var(--gray-500);font-size:13px;">On request</div>';

  return '<a href="' + esc(r.url) + '" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">'
    + '<div class="card' + (isBest ? ' best' : '') + '">'
    + (isBest ? '<div class="best-badge">BEST</div>' : '')
    + '<div class="card-img">' + img + '</div>'
    + '<div class="card-body">'
    + '<div class="src-badge">' + esc(r.source) + '</div>'
    + '<div class="card-title">' + esc(r.title) + '</div>'
    + priceHtml
    + '</div></div></a>';
}

function setLoading(on) {
  var btn = document.getElementById('huntBtn');
  var grid = document.getElementById('grid');
  if (on) {
    btn.disabled = true;
    btn.textContent = '⏳ Hunting...';
    grid.innerHTML = '<div class="skel" style="height:300px"></div>'.repeat(12);
  } else {
    btn.disabled = false;
    btn.textContent = 'Hunt Prices';
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* ── Autocomplete ── */
var _acTimer = null;
var _acIdx = -1;
var _acItems = [];

var qInput = document.getElementById('q');
var sugBox = document.getElementById('suggestions');

function hideSuggestions() {
  sugBox.style.display = 'none';
  _acIdx = -1;
}

function showSuggestions(items) {
  _acItems = items;
  _acIdx = -1;
  if (!items.length) { hideSuggestions(); return; }
  var html = '';
  items.forEach(function(s, i) {
    html += '<div class="sug-item" data-i="' + i + '" onmousedown="pickSuggestion(' + i + ')">'
      + '<span class="sug-icon">🔍</span>' + esc(s) + '</div>';
  });
  sugBox.innerHTML = html;
  sugBox.style.display = 'block';
}

function pickSuggestion(i) {
  qInput.value = _acItems[i];
  hideSuggestions();
  doSearch(_acItems[i]);
}

function fetchSuggestions(val) {
  if (val.length < 2) { hideSuggestions(); return; }
  fetch('/api/autocomplete?q=' + encodeURIComponent(val))
    .then(function(r) { return r.json(); })
    .then(function(items) { showSuggestions(items); })
    .catch(function() {});
}

qInput.addEventListener('input', function() {
  clearTimeout(_acTimer);
  _acTimer = setTimeout(function() { fetchSuggestions(qInput.value.trim()); }, 220);
});

qInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    if (_acIdx >= 0 && _acItems[_acIdx]) {
      qInput.value = _acItems[_acIdx];
    }
    hideSuggestions();
    doSearch();
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    _acIdx = Math.min(_acIdx + 1, _acItems.length - 1);
    sugBox.querySelectorAll('.sug-item').forEach(function(el, i) {
      el.classList.toggle('active', i === _acIdx);
    });
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    _acIdx = Math.max(_acIdx - 1, -1);
    sugBox.querySelectorAll('.sug-item').forEach(function(el, i) {
      el.classList.toggle('active', i === _acIdx);
    });
    return;
  }
  if (e.key === 'Escape') { hideSuggestions(); }
});

document.addEventListener('click', function(e) {
  if (!sugBox.contains(e.target) && e.target !== qInput) hideSuggestions();
});

document.getElementById('huntBtn').addEventListener('click', function() {
  hideSuggestions();
  doSearch();
});

initHome();
</script>
</body>
</html>
